# Fill only from verified private target configuration after deployment approval.
server {
    listen 443 ssl;
    server_name REPLACE_WITH_VERIFIED_LINUX_IP;
    ssl_certificate /etc/huuuge-self-service/acme/live/task0037-panel/fullchain.pem;
    ssl_certificate_key /etc/huuuge-self-service/acme/live/task0037-panel/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # Do not expose data/private, source, raw logs or cloud control endpoints.
    location / {
        proxy_pass http://127.0.0.1:18738;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        send_timeout 10s;
        client_max_body_size 8k;
    }
}
