# Candidate only. Requires owner approval before adding to an existing HTTPS server.
# Dedicated origin is preferred; using a shared origin needs a separate trust review.
# Do not include SDK/runtime files as an unauthenticated static alias.
location / {
    proxy_pass http://127.0.0.1:18738;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_request_buffering off;
    send_timeout 10s;
    client_max_body_size 8k;
    access_log off;
}
