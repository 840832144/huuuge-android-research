# Candidate only: append a bounded Match block after existing global directives.
# OpenSSH 8.0 may lack sshd_config.d Include. Back up, sshd -t and -T first.
Match User huuuge-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    ChallengeResponseAuthentication no
    AuthorizedKeysFile /etc/huuuge-self-service/tunnel_authorized_keys
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:15555
    PermitOpen none
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitTTY no
    PermitTunnel no
    AllowAgentForwarding no
    X11Forwarding no
    MaxSessions 0
    ForceCommand /bin/false
Match all
