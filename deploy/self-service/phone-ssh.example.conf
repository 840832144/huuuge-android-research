# Task directory only. Do not modify the vendor SSH daemon.
Host task0037-linux
    HostName REPLACE_WITH_VERIFIED_EXISTING_LINUX
    Port 22
    User huuuge-tunnel
    IdentityFile /data/local/tmp/task0037/ssh/id_ed25519
    UserKnownHostsFile /data/local/tmp/task0037/ssh/known_hosts
    GlobalKnownHostsFile /dev/null
    StrictHostKeyChecking yes
    UpdateHostKeys no
    IdentitiesOnly yes
    BatchMode yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PreferredAuthentications publickey
    RemoteForward 127.0.0.1:15555 127.0.0.1:5555
    ExitOnForwardFailure yes
    ServerAliveInterval 10
    ServerAliveCountMax 3
    ConnectTimeout 10
    RequestTTY no
