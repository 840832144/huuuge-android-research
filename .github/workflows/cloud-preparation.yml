name: Cloud preparation (synthetic only)
on:
  push:
    branches: [codex/huuuge-cloud-single-instance, codex/huuuge-self-service-v1]
  pull_request:
    paths:
      - 'scripts/cloud_capture.py'
      - 'scripts/extract_embedded_descriptors.py'
      - 'artifacts/live_probe/live_decode.py'
      - 'tests/test_cloud_capture.py'
      - 'tests/test_embedded_descriptors.py'
      - 'deploy/cloud/requirements.txt'
      - 'self_service/**'
      - 'deploy/self-service/**'
      - 'tests/test_self_service.py'
      - 'tests/test_capture_runtime.py'
      - '.github/workflows/cloud-preparation.yml'
permissions:
  contents: read
jobs:
  synthetic-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/cloud/requirements.txt -r deploy/self-service/requirements.txt
      - run: python -m unittest discover -s tests -p test_cloud_capture.py -v
      - run: python -m unittest discover -s tests -p test_embedded_descriptors.py -v
      - run: python -m unittest discover -s tests -p test_self_service.py -v
      - run: python -m unittest discover -s tests -p test_capture_runtime.py -v
