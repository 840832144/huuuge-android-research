name: Cloud preparation (synthetic only)
on:
  push:
    branches: [codex/huuuge-cloud-single-instance]
  pull_request:
    paths:
      - 'scripts/cloud_capture.py'
      - 'artifacts/live_probe/live_decode.py'
      - 'tests/test_cloud_capture.py'
      - '.github/workflows/cloud-preparation.yml'
permissions:
  contents: read
jobs:
  synthetic-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'protobuf>=5.26,<8'
      - run: python -m unittest discover -s tests -p test_cloud_capture.py -v
